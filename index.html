<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Peringatan Dini Deforestasi - Tugas Pertemuan 6</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f8f3; margin: 0; padding: 40px; display: flex; justify-content: center; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 550px; }
        h2 { color: #1b4332; margin-top: 0; text-align: center; }
        p.subtitle { text-align: center; color: #555; font-size: 14px; margin-bottom: 25px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; color: #333; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        button { background-color: #2d6a4f; color: white; border: none; padding: 12px; width: 100%; border-radius: 6px; font-size: 16px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        button:hover { background-color: #1b4332; }
        .result { margin-top: 20px; padding: 15px; border-radius: 6px; background-color: #d8f3dc; color: #1b4332; font-weight: bold; display: none; }
        .result ul { margin: 5px 0 0 20px; padding: 0; font-weight: normal; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Peringatan Dini Deforestasi (AI Satelit)</h2>
        <p class="subtitle">Materi: Attributing direct drivers to deforestation alerts with satellite imagery and AI (Bart Slagter)[cite: 1]</p>
        
        <div class="form-group">
            <label for="ndviAwal">Nilai NDVI Vegetasi Awal (0.0 - 1.0):</label>
            <input type="number" id="ndviAwal" value="0.85" step="0.01" min="0" max="1">
        </div>

        <div class="form-group">
            <label for="ndviBaru">Nilai NDVI Terbaru Setelah Pengamatan (0.0 - 1.0):</label>
            <input type="number" id="ndviBaru" value="0.35" step="0.01" min="0" max="1">
        </div>

        <button onclick="analisisPeringatanSatelit()">Jalankan Deteksi AI Satelit</button>

        <div id="hasil" class="result"></div>
    </div>

    <script>
        function analisisPeringatanSatelit() {
            let awal = parseFloat(document.getElementById('ndviAwal').value);
            let baru = parseFloat(document.getElementById('ndviBaru').value);
            let hasilDiv = document.getElementById('hasil');

            if (isNaN(awal) || isNaN(baru) || awal < 0 || awal > 1 || baru < 0 || baru > 1) {
                hasilDiv.style.display = 'block';
                hasilDiv.style.backgroundColor = '#ffebee';
                hasilDiv.style.color = '#c62828';
                hasilDiv.innerText = 'Mohon masukkan nilai indeks NDVI antara 0.0 sampai 1.0 yang valid!';
                return;
            }

            let penurunan = ((awal - baru) / awal) * 100;
            let status = "";
            let warnaBg = "#d8f3dc"; 
            let warnaText = "#1b4332";

            if (penurunan <= 10) {
                status = "AMAN: Kerapatan tutupan hutan stabil/normal.";
                warnaBg = "#d8f3dc"; warnaText = "#1b4332";
            } else if (penurunan <= 30) {
                status = "PERINGATAN SEDANG: Terdeteksi degradasi vegetasi parsial (Potensi Pembalakan Selektif).";
                warnaBg = "#fffde7"; warnaText = "#f57f17";
            } else {
                status = "BAHAYA (ALERT): Terdeteksi Pembukaan Lahan Masif / Deforestasi Berat! 🚨";
                warnaBg = "#ffebee"; warnaText = "#c62828";
            }

            hasilDiv.style.display = 'block';
            hasilDiv.style.backgroundColor = warnaBg;
            hasilDiv.style.color = warnaText;
            hasilDiv.innerHTML = `
                Hasil Deteksi Dini AI Satelit:
                <ul>
                    <li>NDVI Sebelum vs Sesudah: ${awal} ➔ ${baru}</li>
                    <li>Penurunan Tutupan Vegetasi: ${penurunan.toFixed(1)}%</li>
                    <li><b>Status Sistem: ${status}</b></li>
                </ul>
            `;
        }
    </script>

</body>
</html>
